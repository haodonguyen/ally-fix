packages:
  - "apps/*"
  - "packages/*"

# Force a single ioredis version so BullMQ and our direct usage share one type/instance.
overrides:
  ioredis: "^5.11.1"
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # Only prints a version notice; the OTLP exporters need none of its build output.
  protobufjs: false
  sharp: true
